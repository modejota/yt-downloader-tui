# Builds a single self-contained executable for every supported platform and
# publishes them as a GitHub Release. Triggered by pushing a version tag:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Everything is cross-compiled on one Linux runner. `--os/--cpu "*"` makes bun
# install the native packages (OpenTUI renderer, node-av codec addon) for every
# platform, and scripts/build.ts embeds the target's addon in its executable.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies for every platform
        run: bun install --frozen-lockfile --os="*" --cpu="*"

      - name: Test
        run: bun test

      - name: Build all targets
        run: bun scripts/build.ts all

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir release
          for target in windows-x64 linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            name="yt-downloader-tui-v${VERSION}-${target}"
            if [ "${target}" = windows-x64 ]; then
              mv "dist/yt-downloader-tui-${target}.exe" "release/${name}.exe"
            else
              chmod +x "dist/yt-downloader-tui-${target}"
              tar -czf "release/${name}.tar.gz" -C dist "yt-downloader-tui-${target}" \
                --transform "s|^yt-downloader-tui-${target}|yt-downloader-tui|"
            fi
          done
          cd release && sha256sum ./* > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
